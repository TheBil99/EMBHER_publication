# GPU environment: Borzoi capture and attribution (workflows 06, 15, 95, 98).
#   sbatch src/scripts/build_embher_gpu_env.sh        # builds this file, then the three --no-deps installs below
# conda part: the torch / CUDA stack, pinned as used for the paper. pip part: what the four workflows import
# plus the dependencies of decima, grelu and embher, from PyPI (no forks, no local checkouts).
# decima, grelu, enformer-pytorch and embher[attribution] are installed by the script with `pip install --no-deps`
# (see EMBHER_COMMIT there): every grelu release pins captum==0.5.0, a 2022 release, while this env
# runs captum 0.9.0 as the paper's runs did, so pip's resolver cannot satisfy them together. Same for
# enformer-pytorch (a grelu dependency, pins transformers==4.56.2; borzoi-pytorch needs >=4.57.6), installed
# --no-deps as well.
# pytorch / libtorch are pinned to the CUDA 13.0 build the paper's runs used (exact build strings): without them
# conda picks the CPU build on a machine without a GPU driver. That build needs CUDA visible to conda, so on a
# machine without a GPU build with CONDA_OVERRIDE_CUDA set (build_embher_gpu_env.sh does).
# Changing the embher pin can change numerical results.
name: embher_gpu
channels:
  - conda-forge
dependencies:
  - _openmp_mutex=4.5
  - bzip2=1.0.8
  - ca-certificates=2026.7.22
